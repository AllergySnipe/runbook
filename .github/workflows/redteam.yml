name: red-team

# The log-injection red-team (ADR-0012) drives the REAL loop against crafted
# poisoned inputs and fails on any hardened-condition attack success. Every case
# in `redteam/attacks.py` is a standing regression assertion (ADR-0016): a hole
# that is closed today stays closed.
#
# It is kept out of `ci.yml` (real model + retrieval calls, needs secrets —
# ADR-0012 §4). Instead:
#
#   - pull_request touching a defence surface  → run BEFORE the risky change
#     merges (blocks the regression, doesn't just report it)
#   - schedule (weekly)                         → backstop for drift that never
#     touches those files: a dependency/model bump, a `config.py` model swap, the
#     served model changing under a pinned `:free` name
#   - workflow_dispatch                         → on demand
#
# Needs repo secrets: OPENROUTER_API_KEY, JINA_API_KEY, DATABASE_URL,
# DATABASE_URL_UNPOOLED (same as a local `.env`).

on:
  pull_request:
    paths:
      - "src/runbook/prompts/**"
      - "src/runbook/core/loop.py"
      - "src/runbook/core/guardrail.py"
      - "src/runbook/core/triage.py"
      - "src/runbook/rag/**"
      - "src/runbook/redteam/**"
      - ".github/workflows/redteam.yml"
  schedule:
    - cron: "17 6 * * 1" # ~06:17 UTC every Monday (offset off the hour — GitHub cron is congested on it)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  redteam:
    name: hardened attack-success-rate must be 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync (frozen lockfile)
        run: uv sync --frozen

      - name: red-team (hardened only)
        # `runbook redteam` exits non-zero on any hardened success or any errored
        # case — that is the gate. `--condition hardened` skips the baseline pass
        # (it exists to quantify what the prompt defences buy, not to gate).
        run: uv run runbook redteam --condition hardened -j 3 --json redteam-results/ci.json

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: redteam-results/ci.json
