name: red-team (nightly)

# The log-injection red-team (ADR-0012) drives the REAL loop against crafted
# poisoned inputs and fails on any hardened-condition attack success. It is kept
# out of `ci.yml` because it makes real model + retrieval calls (ADR-0012 §4) —
# but every attack in `redteam/attacks.py` is a standing regression assertion, so
# it runs here on a schedule and on demand. This is the "red-team → eval
# flywheel" guard (ADR-0016): a hole that is closed today stays closed.
#
# Needs repo secrets: OPENROUTER_API_KEY, JINA_API_KEY, DATABASE_URL,
# DATABASE_URL_UNPOOLED (same as a local `.env`).

on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily (offset off the hour — GitHub cron is congested on the hour)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  redteam:
    name: hardened attack-success-rate must be 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync (frozen lockfile)
        run: uv sync --frozen

      - name: red-team (hardened only)
        # `runbook redteam` exits non-zero on any hardened success or any errored
        # case — that is the gate. `--condition hardened` skips the baseline pass
        # (it exists to quantify what the prompt defences buy, not to gate).
        run: uv run runbook redteam --condition hardened -j 3 --json redteam-results/nightly.json

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-nightly
          path: redteam-results/nightly.json
