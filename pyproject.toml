[project]
name = "runbook"
version = "0.1.0"
description = "An on-call incident-response copilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "trafilatura>=2.2.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "langfuse>=4.15.1",
]

[project.scripts]
runbook = "runbook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runbook"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
