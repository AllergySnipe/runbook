service: paymentsvc

upstreams:
  - name: postgres-primary
    kind: database
    health: healthy
    note: "CPU ~34%, no lock waits, replication lag < 1s — database is not the bottleneck"
  - name: redis-idempotency
    kind: cache
    health: healthy
  - name: acquirer-gw
    kind: external_api
    health: healthy
    status_url: "https://status.acquirer-gw.example"
    note: "no declared incident; p95 ~180ms"

downstreams:
  - name: payments-events
    kind: queue
    health: healthy
  - name: ledger
    kind: service
    health: healthy

neighbours: [checkout-web, fraud-scoring, notification-svc]
