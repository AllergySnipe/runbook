summary: >
  p99 on POST /charges crossed 2s at ~T+3m. Pool checked-out is pinned at the
  pool size (20) while Postgres CPU and lock waits stay normal — the database is
  fine, the app cannot get a connection. A deploy at T-9m refactored the charge
  lookup query and query p99 stepped from ~50ms to ~800ms right after, so every
  request holds its connection ~15x longer and throughput no longer covers
  arrival rate. Rolled back at T+24m.

